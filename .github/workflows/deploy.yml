name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

  # Memungkinkan Anda menjalankan workflow ini secara manual dari tab Actions di GitHub
  workflow_dispatch:

# Mengatur izin untuk GITHUB_TOKEN agar diizinkan melakukan deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya mengizinkan satu deploy bersamaan, melewati antrean run yang sedang berjalan dan yang baru
concurrency:
  group: "pages"
  cancel-in-running: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions-deploy-pages@v4